<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messaggi - Plotty</title>
  <meta name="description" content="I tuoi messaggi privati su Plotty." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <script src="auth-check.js"></script>
  <script>checkAuth();</script>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>

  <nav class="topnav" role="navigation" aria-label="Navigazione principale">
    <div class="topnav-left">
      <a href="home.html" class="btn-back" id="btnBack" aria-label="Torna alla home">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Home
      </a>
      <div class="topnav-brand" aria-label="Plotty">Pl<em>o</em>tty</div>
    </div>
    <div class="topnav-right">
      <a href="personal.html" class="btn-nav-avatar" id="navAvatar" aria-label="Il mio profilo">
        <svg class="avatar-fallback-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <button class="btn-logout" id="btnLogout" aria-label="Logout">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Esci
      </button>
    </div>
  </nav>

  <div class="chat-layout" id="chatLayout">

    <aside class="chat-sidebar" id="chatSidebar" aria-label="Conversazioni">
      <div class="sidebar-header">
        <h1 class="sidebar-title">Messaggi</h1>
        <p class="sidebar-subtitle" id="sidebarSubtitle">Caricamento...</p>
      </div>

      <div class="sidebar-search-wrap">
        <div class="sidebar-search-box">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="userSearchInput" class="sidebar-search-input" placeholder="Cerca un utente..." autocomplete="off" aria-label="Cerca un utente per username" />
          <button class="sidebar-search-clear" id="searchClear" aria-label="Cancella ricerca" style="display:none;">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="search-results" id="searchResults" style="display:none;" role="listbox" aria-label="Risultati ricerca utenti"></div>
      </div>

      <div class="conv-list" id="convList" role="list" aria-label="Lista conversazioni">
        <div class="skeleton skel-conv"></div>
        <div class="skeleton skel-conv"></div>
        <div class="skeleton skel-conv"></div>
      </div>
    </aside>

    <section class="chat-window" id="chatWindow" aria-label="Finestra chat">
      <div class="chat-placeholder" id="chatPlaceholder">
        <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h2>I tuoi messaggi</h2>
        <p>Seleziona una conversazione dalla lista<br>o cerca un utente per iniziarne una nuova.</p>
      </div>

      <header class="chat-header" id="chatHeader" style="display:none;" aria-label="Intestazione chat">
        <div id="chatHeaderAvatar"></div>
        <div>
          <div class="chat-header-name" id="chatHeaderName">-</div>
          <div class="chat-header-status">Conversazione privata</div>
        </div>
        <a href="#" class="chat-header-link" id="chatHeaderLink" aria-label="Vai al profilo">Profilo</a>
      </header>

      <div class="messages-wrap" id="messagesWrap" style="display:none;" role="log" aria-live="polite" aria-label="Messaggi"></div>

      <div class="chat-input-area" id="chatInputArea" style="display:none;">
        <textarea id="chatInput" class="chat-input" placeholder="Scrivi un messaggio..." rows="1" aria-label="Campo testo messaggio" maxlength="2000"></textarea>
        <button class="btn-send" id="btnSend" aria-label="Invia messaggio" disabled>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <script src="chat.js" defer></script>
</body>
</html>
